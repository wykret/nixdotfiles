general {
    ignore_empty_input = true
}

background {
    path = screenshot
    blur_size = 3
    blur_passes = 4
    monitor =
    color = rgba(0,0,0,1.0)
}

input-field {
    monitor =
    size = 200, 50
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    inner_color = #222222
    font_color = #ffffff
    font_family = Fira Semibold
    outer_color = #ffffff
    outline_thickness = 3
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 10
    check_color = #888888
    fail_color = #ff5555
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = #51111f
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = #000000
    shadow_boost = 1.6
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = #ffffff
    font_size = 70
    font_family = Bebas Neue Regular
    position = -50, 20
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
label {
    monitor =
    text = $USER
    color = #ffffff
    font_size = 20
    font_family = Fira Code Regular
    position = -50, 120
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:5000] sh -c 'B=$(cat /sys/class/power_supply/BAT*/capacity); S=$(cat /sys/class/power_supply/BAT*/status); if [ "$S" = "Charging" ]; then echo "🔌 $B%"; elif [ "$B" -le 20 ]; then echo "🪫 $B%"; else echo "🔋 $B%"; fi'
    color = #ffffff
    font_size = 22
    font_family = Fira Code Regular
    position = 0, 0
    halign = left
    valign = top
    shadow_passes = 5
    shadow_size = 10
}
