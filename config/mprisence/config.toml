event_driven = true
#interval = 10
#discovery_interval = 10
allowed_players = []

[template]
details = "{{{title}}}"
state = "{{{artist_display}}}"
large_text = "{{#if album}}{{{album}}}{{#if year}} ({{{year}}}){{/if}}{{/if}}"
small_text = "{{#if player}}{{{player}}}{{else}}MPRIS{{/if}}"

[time]
show = true
as_elapsed = false

[activity_type]
use_content_type = true
default = "listening"

[cover]
file_names = ["cover", "folder", "front", "album", "art"]
local_search_depth = 2

[cover.provider]
provider = ["catbox", "musicbrainz"]

[cover.provider.imgbb]
expiration = 86400

[cover.provider.musicbrainz]
min_score = 100

[cover.provider.catbox]
use_litter = true
litter_hours = 24

[player]
# Priority: user entries override bundled ones. Fields left unset in a higher-priority entry fall back to lower matches, then [player.default], then built-in defaults. If identity and bus-name differ, an exact user bus-name entry wins.
# Bundled app ID would show "mprisence", so "name" maps to "state".
default = { ignore = true, app_id = "1121632048155742288", icon = "https://raw.githubusercontent.com/lazykern/mprisence/main/assets/icon.png", show_icon = false, allow_streaming = false, status_display_type = "name" }


[player.strawberry]
ignore = false
app_id = "1126197744512536647"
icon = "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Strawberry-icon-1000px.png/800px-Strawberry-icon-1000px.png"
allow_streaming = true
