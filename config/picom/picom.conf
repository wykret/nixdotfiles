#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# NVIDIA stability (DO NOT REMOVE)
#################################

unredir-if-possible = false;
glx-no-rebind-pixmap = true;
glx-no-stencil = true;
glx-copy-from-front = false;
xrender-sync-fence = true;
use-damage = true;

#################################
# Shadows
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.35;

#################################
# Fading animations
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
# Transparency
#################################

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.95;

#################################
# Blur (GLX only)
#################################

blur-method = "dual_kawase";
blur-strength = 6;

#################################
# Detection
#################################

detect-client-opacity = true;
detect-fullscreen = true;
detect-rounded-corners = true;

